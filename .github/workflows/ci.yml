name: Idea2Crate CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: rust-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned Rust and web tools
        shell: bash
        run: |
          rustup show
          wasm_bindgen_version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          if [[ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $wasm_bindgen_version" ]]; then
            cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
          fi
      - name: Local pre-commit checks
        run: |
          python3 -m pip install pre-commit==4.7.0
          pre-commit run --all-files
      - name: Check native library and build standalone demo
        run: |
          cargo check --locked --workspace --lib --all-features
          cargo build --locked -p egui-web-sandbox --example basic --features web --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/basic.wasm --target web --no-typescript --out-dir .build/site/sandbox
          cp crates/egui-web-sandbox/examples/index.html .build/site/sandbox/index.html
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check isolated browser instances
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix crates/egui-web-sandbox/browser-tests
          cd crates/egui-web-sandbox/browser-tests
          npx playwright install --with-deps chromium --only-shell
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .build/site &
          sandbox_server=$!
          trap 'kill "$sandbox_server"' EXIT
          npm test --prefix crates/egui-web-sandbox/browser-tests
      - name: Validate workflows
        run: |
          curl --fail --location --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
