name: Synchronize and verify shared standards
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standards-reconcile
  cancel-in-progress: false
jobs:
  targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.enrollment.outputs.repositories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select enrolled repositories
        id: enrollment
        run: |
          python3 -c 'import json; from standards.bundle import GitSource, registry; names=[{"full_name": x, "name": x.split("/", 1)[1]} for x in registry(GitSource("."), GitSource(".").head)]; print("repositories="+json.dumps(names, separators=(",", ":")))' >> "$GITHUB_OUTPUT"
  reconcile:
    needs: targets
    if: needs.targets.outputs.repositories != '[]'
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.targets.outputs.repositories) }}
    name: reconcile (${{ matrix.repository.full_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.STANDARDS_APP_ID }}
          private-key: ${{ secrets.STANDARDS_APP_PRIVATE_KEY }}
          owner: Idea2Crate
          repositories: ${{ matrix.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
      - name: Sync approved policy and check open PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STANDARDS_APP_ID: ${{ vars.STANDARDS_APP_ID }}
          STANDARDS_BOT_ID: ${{ vars.STANDARDS_BOT_ID }}
          STANDARDS_REPOSITORY: ${{ matrix.repository.full_name }}
        run: python3 -m standards reconcile --sync --repository "$STANDARDS_REPOSITORY"
