<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Lab · egui-web-sandbox</title>
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}#status{position:absolute;left:16px;top:16px;font:14px system-ui}</style>
<canvas id="canvas"></canvas>
<div id="status">Loading…</div>
<script type="module">
import init, { start } from './basic.js';
try {
  await init();
  await start(!new URL(location.href).searchParams.has('observe'));
  document.querySelector('#status').remove();
} catch (error) {
  document.querySelector('#status').textContent = `Loading failed: ${error}`;
}
</script>
</html>
