<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Desktop</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: #091826; color: #e9f0f6; }
  nav { flex: none; padding: 8px 14px; background: #132435; border-bottom: 1px solid #335169; }
  button { font: inherit; color: inherit; padding: 5px 10px; border: 1px solid #45657e; border-radius: 5px; background: #203b50; }
  button:hover { background: #30556e; }
  main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 40% 15%, #284960, #091826 75%); }
  section { position: absolute; display: flex; flex-direction: column; border: 1px solid #5b7b92; border-radius: 8px; overflow: hidden; background: #172d3f; box-shadow: 0 16px 56px #08121d99; }
  section[hidden] { display: none; }
  header { display: flex; align-items: center; gap: 8px; padding: 4px; flex: none; }
  #move { text-align: left; cursor: grab; flex: 1; background: transparent; border-color: transparent; touch-action: none; }
  iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #fff; }
  #resize { align-self: flex-end; min-width: 30px; min-height: 22px; background: transparent; border: 0; cursor: nwse-resize; touch-action: none; }
  section[data-moving] iframe { pointer-events: none; }
</style>
<nav aria-label="Desktop"><button id="open">Open app</button></nav>
<main aria-label="Workspace">
  <section aria-label="App window" hidden>
    <header>
      <button id="move" aria-label="Move app window">Application</button>
      <button id="close" aria-label="Close app window">×</button>
    </header>
    <button id="resize" aria-label="Resize app window">◢</button>
  </section>
</main>
<script type="module" src="./desktop.mjs"></script>
</html>
