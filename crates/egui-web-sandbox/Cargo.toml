[package]
name = "egui-web-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An isolated egui desktop host for browser demos and agent-driven UI tests"
repository = "https://github.com/Idea2Crate/Idea2Crate"
license = "MIT"
readme = "README.md"
publish = false
include = ["/src/**", "/docs/**", "/examples/**", "/browser/*.mjs", "/browser-tests/*.mjs", "/browser-tests/package*.json", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
web = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
egui = { version = "0.37.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "HtmlCanvasElement", "KeyboardEvent", "ClipboardEvent"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen-futures = "0.4"

[[example]]
name = "basic"
crate-type = ["cdylib"]
required-features = ["web"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
