[package]
name = "egui-web-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An isolated egui desktop host for browser demos and agent-driven UI tests"
repository = "https://github.com/Idea2Crate/Idea2Crate"
license = "MIT"
readme = "README.md"
publish = false
include = ["/src/**", "/docs/**", "/examples/**", "/browser/*.mjs", "/browser/*.html", "/browser-tests/*.mjs", "/browser-tests/package*.json", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
web = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
launcher = ["web", "dep:eframe", "dep:egui-web-sandbox-macros", "dep:wasm-bindgen-futures"]
cli = ["dep:percent-encoding", "dep:tiny_http", "dep:zip"]

[dependencies]
egui = { version = "0.37.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = { version = "0.12", optional = true, default-features = false }
percent-encoding = { version = "2.3", optional = true }
zip = { version = "9.7", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "HtmlCanvasElement", "KeyboardEvent", "ClipboardEvent"] }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["glow", "default_fonts"] }
egui-web-sandbox-macros = { version = "0.1.0", path = "../egui-web-sandbox-macros", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3", features = ["Location", "UrlSearchParams"] }

[[bin]]
name = "egui-web-sandbox"
required-features = ["cli"]

[[example]]
name = "basic"
crate-type = ["cdylib"]
required-features = ["launcher"]

[[example]]
name = "startup_failure"
crate-type = ["cdylib"]
required-features = ["launcher"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
