[package]
name = "egui-web-sandbox-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Build and embed an egui sandbox Web app into its native executable"
repository = "https://github.com/Idea2Crate/Idea2Crate"
publish = false

[features]
cli = ["dep:egui-web-sandbox", "dep:tempfile"]

[[bin]]
name = "egui-web-sandbox"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
depfile = "0.1.1"
serde_json = "1.0"
wasm-bindgen-cli-support = "=0.2.130"
egui-web-sandbox = { version = "0.1.0", path = "../egui-web-sandbox", features = ["server"], optional = true }
tempfile = { version = "3", optional = true }

[lints.rust]
unsafe_code = "forbid"
