[package]
name = "egui-embedded-web-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
path = "../web-app/src/lib.rs"
crate-type = ["cdylib"]

[build-dependencies]
egui-web-sandbox-build = { version = "0.1.0", path = "../../crates/egui-web-sandbox-build" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-web-sandbox = { version = "0.1.0", path = "../../crates/egui-web-sandbox", features = ["server"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-web-sandbox = { version = "0.1.0", path = "../../crates/egui-web-sandbox", features = ["launcher"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints.rust]
unsafe_code = "forbid"
