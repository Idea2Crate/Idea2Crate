minimum_pre_commit_version: '4.7.0'
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--enforce-all]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 488940d9de1b658fac229e34c521d75a6ea476f2 # v0.14.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: credential-patterns
        name: Reject private keys and recognizable credential tokens
        entry: python hooks/check_secrets.py
        language: python
        types: [text]
      - id: python-tests
        name: Credential guard regression test
        entry: python -m unittest discover -s tests
        language: python
        pass_filenames: false
        always_run: true
      - id: rust-format
        name: Rust formatting
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        always_run: true
      - id: rust-lint
        name: WASM library and examples Clippy
        entry: cargo clippy --locked --workspace --exclude egui-web-sandbox-build --lib --examples --all-features --target wasm32-unknown-unknown -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: rust-native-lint
        name: Native server and build helper Clippy
        entry: cargo clippy --locked -p egui-web-sandbox -p egui-web-sandbox-build --lib --bins --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
